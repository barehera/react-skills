interface:
  display_name: "Build Composable Components"
  short_description: "Build maintainable compound React component families"
  default_prompt: "Use $build-composable-components to design or refactor this React component family so it knows only UI: preserved primitive contracts, a root holding only shared state, parts the consumer omits or relabels with copy as children, consumer-mapped lists with status parts, record parts only where a record or rule is read, cva variants on container parts, and composable persistent overlays."
